<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Cookbook</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .search-box { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .recipe-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .category-tag { background: #007BFF; color: white; padding: 3px 8px; border-radius: 3px; font-size: 0.8em; }
    </style>
</head>
<body>

    <h1>Our Family Recipes</h1>

    <div class="search-box">
        <form method="GET" action="">
            <label for="search">Search Title:</label>
            <input type="text" name="search" id="search" value="{{ search_query }}" placeholder="e.g. Chocolate Cake">
            
            <label for="category">Category:</label>
            <select name="category" id="category">
                <option value="">All Categories</option>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>
                        {{ cat }}
                    </option>
                {% endfor %}
            </select>
            
            <button type="submit">Filter</button>
            <a href="{% url 'recipe_list' %}"><button type="button">Clear</button></a>
        </form>
	<a href="{% url 'recipe_create' %}">
	    <button type="button" style="background-color: #28a745; color: white;">+ Add New Recipe</button>
	</a>
    </div>

    <div>
        {% if recipes %}
            {% for recipe in recipes %}
                <div class="recipe-card">
                    <h2><a href="{% url 'recipe_detail' recipe.pk %}">{{ recipe.title }}</a></h2>
                    <p><span class="category-tag">{{ recipe.category }}</span> 
                       <strong>Author:</strong> {{ recipe.author|default:"Unknown" }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>No recipes found matching those criteria.</p>
        {% endif %}
    </div>

</body>
</html>
