<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipe - {{ recipe.title }}</title>
    <style>body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }</style>
</head>
<body>
    <a href="{% url 'recipe_detail' recipe.pk %}">&larr; Back to recipe</a>
    <h1>Edit: {{ recipe.title }}</h1>
    
    <form method="POST">
        {% csrf_token %} <!-- Required security token for Django forms -->
        {{ form.as_p }}  <!-- Renders the form fields wrapped in paragraph tags -->
        <button type="submit" style="padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer;">Save Changes</button>
    </form>
</body>
</html>
