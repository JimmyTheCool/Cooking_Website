<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Photo - {{ recipe.title }}</title>
    <style>body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }</style>
</head>
<body>
    <a href="{% url 'recipe_detail' recipe.pk %}">&larr; Back to recipe</a>
    <h1>Upload Photo for: {{ recipe.title }}</h1>
    
    <!-- enctype="multipart/form-data" is ABSOLUTELY CRITICAL for uploading files -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px; background: #28A745; color: white; border: none; border-radius: 5px; cursor: pointer;">Upload Photo</button>
    </form>
</body>
</html>
